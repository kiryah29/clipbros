# Global settings. Per-channel overrides live in channels.yaml.
data_dir: ./data            # clips, reels and the queue database go here

detector:
  bucket_seconds: 1.0       # chat velocity is measured in messages per bucket
  baseline_halflife_s: 300  # how fast the "normal pace" adapts (EWMA half-life)
  warmup_s: 90              # learn the baseline this long before firing
  z_threshold: 3.0          # spike must be this many std-devs above normal...
  min_ratio: 2.5            # ...AND this many times the normal rate
  min_msgs_per_s: 2.0       # ignore spikes on near-silent chats
  cooldown_s: 45            # no new spike within this window after one ends
  smoothing_buckets: 3      # rolling mean over N buckets to kill single-bucket noise
  min_sustain_s: 3          # rate must stay hot this long before a spike opens
  max_chat_lag_s: 5         # chat arriving this much later than usual (a stalled connection
                            # delivering its backlog) is left out, so it can't fake a spike

clip:
  pre_roll_s: 12            # look-back searched for the moment: chat lags it by 3-8 s
  post_roll_s: 16           # tail after the moment, so the reel can reach min_length_s
  max_length_s: 30          # reels are 20-30 s (longer only while a story is still being told)
  min_length_s: 20          # Hugo 2026-11-25: 11-16 s reels were too short
  raw_max_s: 50             # the cut from the buffer; the reel is re-anchored inside it
  # The reel is re-timed on the loudest 250 ms of audio in that window (engine.py,
  # audio.anchor_on_peak): it starts pre_s before the peak and ends post_s after the
  # reaction fades, so the moment lands in the first ~6 s instead of at ~18 s. If the
  # streamer keeps talking past the end (next word within story_gap_s), the reel follows
  # the story up to story_max_s.
  anchor: {enabled: true, pre_s: 6, post_s: 10, fade_ratio: 0.5, fade_gap_s: 2,
           story_gap_s: 0.8, story_max_s: 40}
  buffer_minutes: 5         # rolling video buffer kept on disk per channel
  quality: "1080p60,1080p,best"

ranking:
  hype_tokens: ["LUL", "KEKW", "OMEGALUL", "POG", "POGGERS", "W", "CLIP", "LMAO", "😂", "💀", "🔥"]

# Moment score (0-100) = sum of weight x strength for each signal. A signal's strength is
# measured against the streamer's own normal level: 0 at normal, half at `trigger_ratio`
# (3x normal), full at 5x. Weights must add up to 1.0. See clipfarm/signals.py.
signals:
  trigger_ratio: 3.0
  weights:
    audio: 0.35             # stream loudness vs normal (screams, explosions)
    speech: 0.20            # streamer talking faster than normal + excited phrases
    chat_speed: 0.22        # chat messages/s vs normal
    chat_words: 0.13        # share of hype words in chat (hype_tokens above)
    game_events: 0.07       # game-profile moment match (config/games/)
    twitch_clips: 0.03      # viewers clipping it on Twitch (not wired up yet, scores 0)

# ClipAgent (clipfarm/agent.py): checks each scored clip against the ClipAgent spec.
# A keyword never makes a clip on its own: a clip needs min_signals of the six checks
# (chat keywords, chat speed spike, !/? or emote-wall chat, audio spike, spoken trigger
# phrase, context event) and one of them must be a chat or audio spike. It also labels
# the clip type and writes <id>_candidate.json next to the clip's receipt.
# Replace a bucket per game/channel, or add to it with extra_chat_keywords /
# extra_speech_phrases (same shape), e.g. a streamer's own emotes or another language.
clip_agent:
  enabled: true
  min_confidence: 0.65      # only clips at or above this are recommended
  gate: true                # true = clips under min_confidence are skipped, not recorded
  min_signals: 2            # independent checks that must agree
  full_signals: 4           # this many agreeing checks = full corroboration
  intensity_full_score: 50  # moment score (0-100) that counts as full intensity
  chat_keyword_share: 0.10  # a bucket counts when this share of spike messages hit it
  punct_share: 0.30         # share of messages with ! or ? that counts as intense chat
  emote_wall_share: 0.30    # one token in this share of messages = emote wall
  chat_keywords:            # matched as whole tokens, case-insensitive, LETSGOOO = letsgoo
    hype: [Pog, POGGERS, PogChamp, GIGACHAD, LETSGO, letsgo]
    funny: [KEKW, OMEGALUL, LUL, LULW]
    tense: [monkaS, PauseChamp, OMG, WTF]
    clip_command: ["!clip", "CLIP IT"]
    outcome_win: [CLUTCH, GG, EZClap]
    outcome_loss: [RIP]
  speech_phrases:           # matched in the streamer's transcript
    shock: ["oh my god", "no way", "what the", "are you kidding me", "insane"]
    celebration: ["let's go", "lets go", "let's goo", "i'm the best", "easy"]
    frustration: ["bruh", "i'm dead", "literally", "what the hell"]
  context_phrases:          # matched in chat AND transcript; these name the clip type
    donation: ["thank you for the", "thanks for the", "donation", "donated", "gifted",
               "bits", "superchat", "super chat"]
    chat_interaction: ["chat said", "chat is", "chat why", "who said", "reading chat",
                       "read that", "chat you"]
    rage_quit: ["alt f4", "alt+f4", "i quit", "i'm done", "uninstall", "rage quit"]
  extra_chat_keywords: {}
  extra_speech_phrases: {}

audio:
  enabled: true
  min_ratio: 6.0            # loudness 6x the streamer's normal (about +16 dB) opens a clip; 3x fired 30 times in 30 min
                            # streams where the game is loud vs the voice (xQc, CaseOh peak ~3x)
                            # need a per-channel override in channels.yaml: audio: {min_ratio: 3.5}
  min_sustain_s: 1          # ...for at least this long
  warmup_s: 90              # learn the normal loudness first
  baseline_halflife_s: 300
  cooldown_s: 30
  confirm: true             # audio-only clips also need chat >= confirm_chat_ratio or an excited phrase
  confirm_chat_ratio: 1.5
  silence_floor: 0.01       # quiet stretches don't drag "normal" below this (RMS 0..1)
  pre_roll_s: 12            # look-back window; the reel itself is anchored on the peak
  post_roll_s: 16           # keep the reaction after the scream (6 s cut off "whoa whoa")

speech:
  engine: auto              # auto | faster_whisper | sherpa_onnx | none (see README)
  whisper_model: base.en    # faster_whisper model size
  sherpa_model_dir: models/sherpa-onnx-whisper-base.en   # python -m clipfarm setup-speech [--model tiny.en]
  clip_model_dir: null      # caption model; null = models/sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8
  language: en
  chunk_s: 4                # transcribe the stream in chunks this long
  max_backlog: 6            # if the PC falls behind, drop the oldest chunks
  max_wait_s: 30            # wait this long for the transcript before scoring a clip
  phrase_target: 3          # this many excited phrases in the clip = full phrase points
  repeat_words: 3           # "no no no" counts as one excited phrase
  max_words_per_s: 6        # pace above this is a transcription glitch, capped
  max_tokens_per_second: 25 # sherpa decode cap; 15 cut fast talkers off mid-sentence
  keywords: ["no way", "oh my god", "oh my gosh", "let's go", "lets go", "what the",
             "what the hell", "what the fuck", "holy", "are you kidding", "oh no", "yo yo",
             "clip that", "clip it", "wtf", "insane", "i'm dead", "get out",
             "help", "bro what", "nah"]

# Nudity check (clipfarm/nudity.py), runs on every clip before the reel is rendered.
# Frames are scanned with NudeNet (~12 MB ONNX model, downloaded into models/ on first use or
# with `python -m clipfarm setup-nudity`). Only the detected box is blurred, not the band.
# Game footage needs game_blur_score (GTA characters score 0.3-0.5); a hit on the facecam
# (a real person) needs blur_score. The clip is HELD for a human look (status "held") only
# when a facecam frame scores review_score or more, or when the check cannot run
# (on_unavailable: review; set it to skip to render anyway).
# The streamer's own voice (clipfarm/voice.py): caption lines that don't sound like the
# streamer (cutscenes, police radio, phone calls, guests) are left out, and only lines that
# clearly do can be quoted on the hook card. Off until a streamer is enrolled:
#   python -m clipfarm voice <channel> --file <clip.mp4> --from <s> --to <s>
voice:
  enabled: true
  model: null                 # null = models/nemo_en_titanet_small.onnx (setup-speech --clip)
  min_similarity: 0.15        # below this a caption line is not the streamer (radio 0.03-0.14)
  quote_min_similarity: 0.3   # hook quotes need a clear match

nudity:
  enabled: true
  model: models/nudenet_320n.onnx
  auto_download: true
  classes: [BUTTOCKS_EXPOSED, FEMALE_BREAST_EXPOSED, FEMALE_GENITALIA_EXPOSED,
            MALE_GENITALIA_EXPOSED, ANUS_EXPOSED]   # shirtless men are fine on TikTok
  sizes: [320, 640]         # 640 catches small figures in wide shots that 320 misses
  sample_fps: 3             # frames scanned per second of clip
  scan_width: 960           # frames are scaled to this width first
  blur_score: 0.30          # facecam (real person)
  review_score: 0.26        # a shirtless man scores ~0.25 as FEMALE_BREAST_EXPOSED
  game_blur_score: 0.50     # gameplay: higher, game characters fire at 0.3-0.5
  box_pad: 0.15             # grow the blurred box by this share of its size
  pad_s: 0.5                # blur this much before/after the first/last flagged frame
  merge_gap_s: 1.0          # blurred parts closer than this join into one
  on_unavailable: review    # review = hold the clip | skip = render without the check

reel:
  width: 1080
  height: 1920
  layout: facecam_top       # facecam_top | gameplay_only | full_cam (just chatting)
  full_cam_face: 0.18       # auto-found face this tall (share of frame) = full-camera stream:
                            # one full-height crop on the streamer instead of two bands
  gameplay_zoom: 1.25       # gameplay band crops this much tighter than filling it, so HUD,
                            # minimap and the streamer's chat overlay at the edges are left out
  facecam_band_ratio: 0.30  # share of height given to the facecam band
  facecam_auto: true        # channel has no facecam: in channels.yaml? find it in the clip
                            # (needs opencv-python-headless); none found = gameplay_only
  gameplay_band_ratio: 0.45 # rest goes to backdrop (or gameplay grows if no backdrop)
  backdrop: null            # e.g. assets/backdrops/parkour.mp4 (must be footage you own/licensed)
  music: null               # e.g. assets/music/track.mp3 (licensed!)
  music_volume: 0.12
  caption_style: clipbros   # clipbros | pop | boxed | clean
  caption_size: 84          # max caption font px (long chunks shrink to fit)
  caption_y_ratio: 0.60     # caption line centre, as a share of height
  # Twitch chat strip (facecam_top only): the live chat from the clip in a solid band right
  # above TikTok's description bar; gameplay gets shorter to make room, backdrop is skipped
  chat_strip: true
  chat_strip_height: 272    # px; the strip ends at the bottom keep-clear zone
  chat_lines: 3             # messages on screen at once, newest at the bottom
  chat_font_size: 44
  chat_min_gap_s: 0.7       # fast chat: at most one new line per this many seconds
  chat_label: "TWITCH CHAT"
  caption_words: 4          # words on screen at once (brand kit shows 4)
  caption_outline: 5        # Ink outline px around Paper caption text
  caption_font: "Inter ExtraBold"   # bundled in assets/fonts
  caption_censor: true      # star out swear words in captions (word list: craft/captions.py)
  font_file: null           # override the brand font (default assets/fonts/Inter-ExtraBold.otf)
  # brand layer (see clipfarm/craft/overlay.py; palette from the brand kit in clipfarm/brand.py)
  accent_color: "#C8F03C"   # Clip Lime: seam line + highlighted caption word
  hook_bg: "#F3F0E8"        # Paper: hook card fill
  hook_color: "#131119"     # Ink: hook card text
  show_logo: true           # ClipBros lockup bottom-left of the gameplay (faces are up top)
  logo_height: 32           # lockup mark height px (lockup ~160 px wide)
  logo_opacity: 0.6
  logo: null                # null = brand-kit lockup drawn from code; or a PNG used as-is
  # keep-clear zones (px) for TikTok UI: side buttons on the right, caption/sound bar at the bottom
  safe_zone: {left: 62, top: 112, right: 124, bottom: 320}
  # Hook card text is written per clip from what happened (clipfarm/hooks.py), most
  # specific first: game-profile moment, excited phrase, a quote from right before the
  # peak, what chat spammed (laughing / W / L / shock / ? / RIP), then loudness or chat
  # speed. The last few hooks of a channel are skipped so clips don't repeat a card.
  # "WAIT FOR IT..." style hooks only when audio reaches audio.min_ratio (or
  # wait_hook_audio_ratio) AND chat is at least wait_hook_chat_ratio x normal.
  hook_text: "WAIT FOR IT..."   # last-resort fallback
  wait_hook_audio_ratio: null   # null = the channel's audio.min_ratio
  wait_hook_chat_ratio: 5.0
  hooks:
    # templates = today's hook templates (clipfarm/hooks.py) | rules = the rule-based writer
    # (clipfarm/hookwriter.py): facts about the clip filled into a few proven hook patterns,
    # scored, templates as fallback. Compare both in the hook lab (clipbros.app/hooklab)
    # before switching: nothing changes on posted clips until this says rules.
    writer: templates
    candidates: 3           # candidates kept in the receipt and shown in the hook lab
    min_score: 1.0          # below this the rule writer falls back to templates
    style_weights: {story: 1.2, story_outcome: 1.3, warning: 1.2, prediction: 1.1, stakes: 1.0,
                    payoff: 1.0, viewer_title: 1.0, game: 0.9, chat_voice: 0.8, quote: 0.6}
    drop_kinds: [chat]      # template kinds never used: no "Chat went 6x faster"
    demote_kinds: [phrase, quote]   # rules writer's fallback uses these last
    plan_phrases: ["i'm gonna", "im gonna", "i'm going to", "let's", "lets", "watch me",
                   "bet i can", "i'm about to", "imma", "i'll"]
    setup_phrases: ["watch this", "watch me", "trust me", "i got this", "too easy", "light work",
                    "this is gonna work", "i can't lose"]
    max_action_words: 6     # "I'm gonna <up to 6 words>"
    chat_min_support: 2     # a chat line needs this many other chatters saying the same thing
    payoff_min_s: 3.0       # "Wait for the ..." only when the peak is this far in
    min_confidence: 0.8     # sound / HUD facts below this are ignored (no fact beats a wrong one)
    max_chars: 42           # longer lines get skipped (card fits 3 lines on 9:16)
    max_quote_words: 6
    quote_within_s: 10      # a quoted phrase or sentence must be said in the reel's first N s
    reaction_share: 0.15    # a reaction must be at least this share of chat's top tokens
    blocklist: []           # extra words never burned onto a clip (built-in list in hooks.py)
    templates: {}           # override a kind's lines, e.g. {chat: ["Chat went {chat_x}x faster"]}
                            # fields: {streamer} {game} {phrase} {quote} {chat_word} {chat_x} {moment}
                            # ClipAgent clip types have their own kinds: type_clutch, type_fail,
                            # type_rage, type_donation, type_chat_interaction, type_hype, type_funny
  hook_seconds: 0           # 0 = hook card stays up the whole clip
  cta_text: "Follow for more clips"
  cta_seconds: 2.5
  # Captions and hook quotes: clip = transcribe each cut clip again with Parakeet (real word
  # timings; python -m clipfarm setup-speech --clip), falling back to the live transcript
  # when the model is missing | auto = live stream transcript | faster_whisper | none
  transcriber: clip
  loudness: {I: -14, TP: -1.5, LRA: 11}   # loudnorm target (two-pass) after a light compressor
  compressor: "acompressor=threshold=-12dB:ratio=2:attack=5:release=150"
