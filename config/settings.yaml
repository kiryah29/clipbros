# Global settings. Per-channel overrides live in channels.yaml.
data_dir: ./data            # clips, reels and the queue database go here

detector:
  bucket_seconds: 1.0       # chat velocity is measured in messages per bucket
  baseline_halflife_s: 300  # how fast the "normal pace" adapts (EWMA half-life)
  warmup_s: 90              # learn the baseline this long before firing
  z_threshold: 3.0          # spike must be this many std-devs above normal...
  min_ratio: 2.5            # ...AND this many times the normal rate
  min_msgs_per_s: 2.0       # ignore spikes on near-silent chats
  cooldown_s: 45            # no new spike within this window after one ends
  smoothing_buckets: 3      # rolling mean over N buckets to kill single-bucket noise
  min_sustain_s: 3          # rate must stay hot this long before a spike opens

clip:
  pre_roll_s: 20            # chat reacts AFTER the moment, so look back
  post_roll_s: 8
  max_length_s: 60
  buffer_minutes: 5         # rolling video buffer kept on disk per channel
  quality: "1080p60,1080p,best"

ranking:
  hype_tokens: ["LUL", "KEKW", "OMEGALUL", "POG", "POGGERS", "W", "CLIP", "LMAO", "😂", "💀", "🔥"]

# Moment score (0-100) = sum of weight x strength for each signal. A signal's strength is
# measured against the streamer's own normal level: 0 at normal, half at `trigger_ratio`
# (3x normal), full at 5x. Weights must add up to 1.0. See clipfarm/signals.py.
signals:
  trigger_ratio: 3.0
  weights:
    audio: 0.35             # stream loudness vs normal (screams, explosions)
    speech: 0.20            # streamer talking faster than normal + excited phrases
    chat_speed: 0.22        # chat messages/s vs normal
    chat_words: 0.13        # share of hype words in chat (hype_tokens above)
    game_events: 0.07       # game-profile moment match (config/games/)
    twitch_clips: 0.03      # viewers clipping it on Twitch (not wired up yet, scores 0)

audio:
  enabled: true
  min_ratio: 6.0            # loudness 6x the streamer's normal (about +16 dB) opens a clip; 3x fired 30 times in 30 min
  min_sustain_s: 1          # ...for at least this long
  warmup_s: 90              # learn the normal loudness first
  baseline_halflife_s: 300
  cooldown_s: 30
  confirm: true             # audio-only clips also need chat >= confirm_chat_ratio or an excited phrase
  confirm_chat_ratio: 1.5
  silence_floor: 0.01       # quiet stretches don't drag "normal" below this (RMS 0..1)
  pre_roll_s: 15            # a scream is AT the moment: shorter look-back than chat
  post_roll_s: 12           # keep the reaction after the scream (6 s cut off "whoa whoa")

speech:
  engine: auto              # auto | faster_whisper | sherpa_onnx | none (see README)
  whisper_model: base.en    # faster_whisper model size
  sherpa_model_dir: models/sherpa-onnx-whisper-base.en   # python -m clipfarm setup-speech [--model tiny.en]
  language: en
  chunk_s: 4                # transcribe the stream in chunks this long
  max_backlog: 6            # if the PC falls behind, drop the oldest chunks
  max_wait_s: 30            # wait this long for the transcript before scoring a clip
  phrase_target: 3          # this many excited phrases in the clip = full phrase points
  repeat_words: 3           # "no no no" counts as one excited phrase
  max_words_per_s: 6        # pace above this is a transcription glitch, capped
  keywords: ["no way", "oh my god", "oh my gosh", "let's go", "lets go", "what the",
             "what the hell", "what the fuck", "holy", "are you kidding", "oh no", "yo yo",
             "clip that", "clip it", "wtf", "insane", "i'm dead", "get out",
             "help", "bro what", "nah"]

reel:
  width: 1080
  height: 1920
  layout: facecam_top       # facecam_top | gameplay_only
  facecam_band_ratio: 0.30  # share of height given to the facecam band
  gameplay_band_ratio: 0.45 # rest goes to backdrop (or gameplay grows if no backdrop)
  backdrop: null            # e.g. assets/backdrops/parkour.mp4 (must be footage you own/licensed)
  music: null               # e.g. assets/music/track.mp3 (licensed!)
  music_volume: 0.12
  caption_style: clipbros   # clipbros | pop | boxed | clean
  caption_size: 84          # max caption font px (long chunks shrink to fit)
  caption_y_ratio: 0.60     # caption line centre, as a share of height
  caption_words: 4          # words on screen at once (brand kit shows 4)
  caption_outline: 5        # Ink outline px around Paper caption text
  caption_font: "Inter ExtraBold"   # bundled in assets/fonts
  caption_censor: true      # star out swear words in captions (word list: craft/captions.py)
  font_file: null           # override the brand font (default assets/fonts/Inter-ExtraBold.otf)
  # brand layer (see clipfarm/craft/overlay.py; palette from the brand kit in clipfarm/brand.py)
  accent_color: "#C8F03C"   # Clip Lime: seam line + highlighted caption word
  hook_bg: "#F3F0E8"        # Paper: hook card fill
  hook_color: "#131119"     # Ink: hook card text
  show_logo: true           # ClipBros lockup top-left
  logo_height: 44           # lockup mark height px (lockup ~220 px wide; kit minimum is 120)
  logo: null                # null = brand-kit lockup drawn from code; or a PNG used as-is
  # keep-clear zones (px) for TikTok UI: side buttons on the right, caption/sound bar at the bottom
  safe_zone: {left: 62, top: 112, right: 124, bottom: 320}
  hook_text: "WAIT FOR IT..."   # fallback; game profiles pick a hook per moment
  hook_seconds: 0           # 0 = hook card stays up the whole clip
  cta_text: "Follow for more clips"
  cta_seconds: 2.5
  transcriber: auto         # auto = live stream transcript | faster_whisper | none
